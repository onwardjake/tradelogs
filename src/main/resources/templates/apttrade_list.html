<!-- src/main/resources/templates/trades.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>아파트 실거래 조회</title>
    <style>
        :root {
            --bg: #111418;      /* 아주 검정 X */
            --panel: #161a20;   /* 패널 배경 */
            --muted: #1d232b;
            --text: #e6e9ef;    /* 본문 */
            --sub: #aab2bf;     /* 보조 텍스트 */
            --accent: #6ea8fe;  /* 포커스 */
            --ok: #6edff6;
            --warn: #ffd166;
            --danger: #ff6b6b;
            --border: #2a313a;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 24px;
            background: var(--bg); color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
        }
        .wrap { max-width: 1200px; margin: 0 auto; }
        h1 { font-size: 20px; margin: 0 0 16px; color: #f0f3f8; }
        .card {
            background: var(--panel); border: 1px solid var(--border);
            border-radius: 12px; padding: 16px; margin-bottom: 16px;
            box-shadow: 0 4px 12px rgba(0,0,0,.25);
        }
        .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }
        .filter-grid {grid-template-columns: repeat(6, 1fr); align-items: end;}
        .right-align {text-align: right;}
        label { display:block; font-size: 12px; color: var(--sub); margin-bottom:6px;}
        select, input[type=number] {
            width: 100%; background: var(--muted); color: var(--text);
            border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px;
            outline: none;
        }
        select:focus, input[type=number]:focus { border-color: var(--accent); }
        .row { display:flex; gap:10px; align-items:center; }
        .btn {
            background: var(--accent); color:#0b1220; border: none; border-radius: 10px;
            padding: 10px 16px; font-weight: 600; cursor: pointer;
        }
        .btn:disabled { opacity: .6; cursor: not-allowed; }
        .table {
            width: 100%; border-collapse: collapse; margin-top: 6px;
        }
        .table th, .table td {
            border-bottom: 1px solid var(--border);
            padding: 10px 8px; font-size: 13px; text-align: left;
        }
        .table td.num {text-align: right; font-variant-numeric: tabular-nums; /* 숫자 정렬 안정적으로 */}
        .table th { color: #cbd5e1; font-weight: 600; background: #121821; position: sticky; top:0;}
        .muted { color: var(--sub); }
        .pagination { display:flex; gap:6px; justify-content: center; margin-top: 12px; }
        .page-btn {
            padding:6px 10px; border:1px solid var(--border); background: var(--muted); color: var(--text);
            border-radius: 8px; text-decoration: none;
        }
        .page-btn.active { background: var(--accent); color: #10121a; border-color: transparent; }
        .hint { font-size: 12px; color: var(--sub); }
    </style>
</head>
<body>
<div class="wrap">
    <h1>아파트 실거래 조회</h1>

    <div class="card">
        <div class="muted">검색 필터</div>
            <form method="get" th:action="@{/apt/trades}" th:object="${filter}">
                <div class="grid filter-grid">
                    <div>
                        <label>시/군/구</label>
                        <select th:field="*{sggCd}">
                            <option value="">-- 시군구 선택 --</option>
                            <option th:each="sgg : ${sggList}"
                                    th:value="${sgg.sggCd}"
                                    th:text="${sgg.sggNm}">
                            </option>
                        </select>
                    </div>
                    <div class="right-align">
                        <button type="submit" class="page-btn">조회</button>
                    </div>
                </div>
            </form>
        </div>
    </div>



    <div class="card">
        <div class="row" style="justify-content: space-between;">
            <div class="muted">총 <strong th:text="${total}">0</strong> 건</div>
            <div class="muted">페이지 <strong th:text="${page}">1</strong> / <span th:text="${totalPages}">1</span></div>
        </div>

        <table class="table">
            <thead>
            <tr>
                <th>No</th>
                <th>아파트</th>
                <th>층</th>
                <th>전용면적(㎡)</th>
                <th>전용면적(평)</th>
                <th>금액 (만원)</th>
                <th>거래일</th>
                <th>지역 (시군구)</th>
                <th>지역 (읍면동)</th>
                <th>건축년도</th>
                <th>취소여부</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="l, iter : ${list}">
                <td th:text="${ ((page ?: 1) - 1) * size + (iter.count) }"></td>
                <td th:text="${l.aptNm}"></td>
                <td th:text="${l.floor}"></td>
                <td th:text="${#numbers.formatDecimal(l.excluUseAr, 1, 2)}" class="num"></td>
                <td th:text="${#numbers.formatDecimal(((l.excluUseAr * 1.0) / 3.3058), 0, 2)}" class="num"></td>
                <td th:text="${#numbers.formatInteger(l.dealAmount, 1, 'COMMA')}" class="num"></td>
                <td th:text="${l.dealDate}"></td>
                <td th:text="${l.sggNm}"></td>
                <td th:text="${l.umdNm}"></td>
                <td th:text="${l.buildYear}"></td>
                <td th:text="${l.cdealType == null ? '정상':'취소'}"></td>
            </tr>
            <tr th:if="${#lists.isEmpty(list)}">
                <td colspan="7" class="muted">조회 결과가 없습니다.</td>
            </tr>
            </tbody>
        </table>

        <!-- 페이지네이션 -->
        <div class="pagination" th:if="${totalPages > 1}"
             th:with="
                start=${page - 2 < 2 ? 2 : page - 2},
                end=${page + 2 > totalPages - 1 ? totalPages - 1 : page + 2}
            ">

            <!-- 이전 페이지 버튼 -->
            <a class="page-btn"
               th:classappend="${page == 1} ? ' disabled'"
               th:href="@{/apt/trades(
                    sggCd=${filter.sggCd},
                    page=${page - 1},
                    size=${size}
               )}"
               th:if="${page > 1}">&laquo;</a>

            <!-- 1페이지 -->
            <a th:href="@{/apt/trades(
                    sggCd=${filter.sggCd},
                    page=${1},
                    size=${size}
                )}"
               th:classappend="${page == 1} ? 'page-btn active' : 'page-btn'"
               th:text="1"></a>

            <!-- 왼쪽 ... -->
            <span th:if="${start > 2}">...</span>

            <!-- 가운데 페이지들 (현재 페이지 앞뒤 2페이지 씩) -->
            <a th:each="p : ${#numbers.sequence(start, end)}"
               th:href="@{/apt/trades(
                    sggCd=${filter.sggCd},
                    page=${p},
                    size=${size}
                )}"
               th:classappend="${p == page} ? 'page-btn active' : 'page-btn'"
               th:text="${p}"></a>

            <!-- 오른쪽 ... -->
            <span th:if="${end < totalPages - 1}">...</span>

            <!-- 마지막 페이지 (totalPages > 1 일 때만 의미 있음) -->
            <a th:if="${totalPages > 1}"
               th:href="@{/apt/trades(
                    sggCd=${filter.sggCd},
                    page=${totalPages},
                    size=${size}
               )}"
               th:classappend="${page == totalPages} ? 'page-btn active' : 'page-btn'"
               th:text="${totalPages}"></a>

            <!-- 다음 페이지 버튼 -->
            <a class="page-btn"
               th:classappend="${page == totalPages} ? ' disabled'"
               th:href="@{/apt/trades(
                    sggCd=${filter.sggCd},
                    page=${page + 1},
                    size=${size}
               )}"
               th:if="${page < totalPages}">&raquo;</a>
        </div>
    </div>
</div>

</body>
</html>
